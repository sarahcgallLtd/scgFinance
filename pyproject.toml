[tool.poetry]
name = "scgFinance"
version = "0.1.0"
description = "A Python package for managing personal finances: import bank statements, categorise expenses automatically or manually, track and visualise spending, forecast trends, and compare against budgets."
authors = ["Sarah C Gall <contact@sarahcgall.co.uk>"]
license = "MIT"
readme = "README.md"
packages = [{include = "scgFinance", from = "src"}]

include = [
    "scgfinance/data/**/*",
]

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.3.3"
scikit-learn = "^1.7.2"
numpy = "^2.3.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^5.0"
black = "^23.0"
flake8 = "^6.0"
sphinx = "^8.0"
pydata-sphinx-theme = "^0.16.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]