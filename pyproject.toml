[tool.poetry]
name = "scgFinance"
version = "0.1.0"
description = "A package for categorising and tracking personal finances."
authors = ["Sarah C Gall <contact@sarahcgall.co.uk>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/sarahcgallLtd/scgFinance"
documentation = "https://docs.sarahcgall.co.uk/scgFinance"
keywords = ["finance", "personal-finance", "budgeting"]
packages = [{include = "scgFinance", from = "src"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
include = [
    "scgfinance/data/**/*",
]

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.3.3"
scikit-learn = "^1.7.2"
numpy = "^2.3.4"
sphinx-favicon = "^1.0.1"
sphinx-copybutton = "^0.5.2"
myst-parser = "^4.0.1"
linkify-it-py = "^2.0.3"
e = "^1.4.5"
sphinx-autoapi = "^3.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^5.0"
black = "^23.0"
flake8 = "^6.0"
sphinx = "^8.0"
pydata-sphinx-theme = "^0.16.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]