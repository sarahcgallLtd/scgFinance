[tool.poetry]
name = "package-name"  # Replace with your package name
version = "0.1.0"
description = "A short description of your package"
authors = ["Sarah Gall <contact@sarahcgall.co.uk"]
license = "MIT"
readme = "README.md"
packages = [{include = "package_name", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.8.1, <4.0"  # Minimum Python version

[tool.poetry.dev-dependencies]
pytest = "^7.0"  # For testing
pytest-cov = "^5.0"  # For coverage reporting
black = "^23.0"  # For code formatting
flake8 = "^6.0"  # For linting

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]